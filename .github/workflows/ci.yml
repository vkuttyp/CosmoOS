        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: Verified boot, tampered files refused, override (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-security

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-security-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-release/test-security/*.log
          if-no-files-found: ignore

  # Milestone M4's acceptance (docs/roadmap-1.0.md; docs/userland/testing.md,
  # "test-net-login"): the installed system on QEMU user networking with no
  # fw_cfg address -- the kernel's DHCP client configures eth0, netcfg writes
  # /etc/resolv.conf, BusyBox wget fetches by address and by name (the last
  # through the runner's internet, three attempts); job control in ash on the
  # console; the host's OpenSSH client logs in to dropbear by key, runs a
  # command and a PTY session, and logs in again after a reboot with the
  # host key unchanged. Release builds, a job of its own like the install test.
  net-login:
    name: net-login test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: DHCP, wget by address and by name, ssh login and a PTY session on the installed system (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-net-login

      # The virtio-gpu unit's acceptance (docs/drivers/virtio/testing.md):
      # the console on a virtio-gpu, read back from QEMU's screendump; in this
      # job because it needs the same release image and is short (~20 s).
      - name: The console on a virtio-gpu, read back from the screen (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-display

      # test-display's directory holds the boots' QMP sockets, which the
      # upload refuses ("entry not supported") and so uploaded nothing at all
      # (TEST-5; docs/audit/2026-10-17-crash3-waiter-report.md): every file
      # but those.
      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-net-login-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-release/test-net-login/*.log
            out/${{ matrix.arch }}-release/test-display/*
            !out/${{ matrix.arch }}-release/test-display/*.sock
          if-no-files-found: ignore

  # Roadmap 1.1 P6's acceptance (docs/pkg/testing.md, "test-pkg-net"): the
  # installed system's pkg against repositories this harness serves over
  # HTTPS -- install and upgrade, and the refusals of untrusted, expired and
  # misnamed certificates (no request reaching the server), a changed
  # package, another key, a replayed and an expired index. Release builds,
  # a job of its own.
  pkg-net:
    name: pkg-net test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: pkg against HTTPS repositories on the installed system (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-pkg-net

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-pkg-net-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-release/test-pkg-net/*.log
          if-no-files-found: ignore

  # Milestone M3's acceptance (docs/roadmap-1.0.md; docs/userland/testing.md,
  # "test-busybox"): BusyBox ash runs the scripted test of every applet and
  # BusyBox's own testsuite for the named files. Release builds, a job of
  # its own like the install test.
  busybox:
    name: busybox test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: BusyBox ash, the scripted test and the testsuite (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-busybox

      - name: Upload the boot's serial log (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-busybox-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-release/test-busybox/*.log
          if-no-files-found: ignore

  # Roadmap M6, decision 8: the release set (`make release`: the signed live
  # image, loader, kernel.elf, boot.tar, cmdline, manifest, SHA256SUMS)
  # built twice in separate trees and compared byte for byte, then made
  # once more and uploaded. Developer-signed here (an ephemeral key in this
  # job); the release workflow builds the same set with the release key in
  # two fresh containers and compares those.
  release-set:
    name: release set, reproducible (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 40
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Release build twice, every output and the release set compared
        run: make ARCH=${{ matrix.arch }} BUILD=release reproducible

      - name: make release
        run: make ARCH=${{ matrix.arch }} release && cat out/release/${{ matrix.arch }}/SHA256SUMS

      - name: Upload the release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-set-${{ matrix.arch }}
          path: out/release/${{ matrix.arch }}/

  # Platform discovery (docs/kernel/arch/aarch64/testing.md, "make
  # test-platforms"): the AArch64 kernel takes its console, GIC, timer and
  # PSCI conduit from the firmware tables, never from QEMU virt's fixed
  # addresses. The image boots under every configuration QEMU can vary --
  # GICv2 and GICv3, highmem off, a CPU with and without RNDR, no serial
  # port -- and must reach the shell with the platform line to match.
  # Both architectures boot with 1, 4 and 8 GiB of RAM: the loader's
  # direct map reaches the top of RAM and `free` reports it.
  platforms:
    name: platform discovery (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45 # eleven AArch64 boots; was 30 for eight
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release image

      - name: Machines that are not the defaults, and 1, 4 and 8 GiB of RAM
        run: make ARCH=${{ matrix.arch }} BUILD=release test-platforms

      - name: Upload the boots' logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-platforms-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-release/test-platforms/*/*.log
          if-no-files-found: ignore

  # Roadmap M6, decision 4: every subsystem directory docs/README.md lists
  # has architecture, design, api, invariants and testing
  # (scripts/check-docs.py). Python on the runner; no container.
  docs:
    name: five-file docs
    runs-on: ubuntu-24.04
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Every listed subsystem has its five files
        run: python3 scripts/check-docs.py

  # Roadmap M6, decision 5: every command in the user guide (docs/guide/),
  # run as written against the release set by tests/guide/run_guide.py --
  # the host commands in one shell, QEMU and ssh as sessions, each CosmoOS
  # command typed at its prompt with its output checked. Linux, both
  # architectures, on every run.
  guide:
    name: user guide commands (linux, ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: [image, release-set]
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The set the release-set job built, the same bytes guide-macos runs.
      - name: The release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-set-${{ matrix.arch }}
          path: out/release/${{ matrix.arch }}

      - name: Every command of the guide, as written
        run: python3 tests/guide/run_guide.py --arch ${{ matrix.arch }} --host linux --release out/release/${{ matrix.arch }} --workdir out/guide-${{ matrix.arch }}

      - name: Upload the guide run's transcripts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guide-linux-${{ matrix.arch }}
          path: out/guide-${{ matrix.arch }}/*.log
          if-no-files-found: ignore

  # The guide's macOS steps (Homebrew's QEMU and firmware), with the rest of
  # the guide, on GitHub's macOS runner against the release set the
  # release-set job made. On pushes to main (and in the release workflow),
  # not on every pull request: macOS minutes cost ten times Linux's.
  guide-macos:
    name: user guide commands (macos, ${{ matrix.arch }})
    if: github.event_name == 'push'
    runs-on: macos-14
    needs: release-set
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-set-${{ matrix.arch }}
          path: out/release/${{ matrix.arch }}

      - name: Every command of the guide, as written
        run: python3 tests/guide/run_guide.py --arch ${{ matrix.arch }} --host macos --release out/release/${{ matrix.arch }} --workdir out/guide-${{ matrix.arch }}

      - name: Upload the guide run's transcripts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guide-macos-${{ matrix.arch }}
          path: out/guide-${{ matrix.arch }}/*.log
          if-no-files-found: ignore

  # The quiescence protocol's litmus tests against the C11 (RC11) model.
  # herdtools7 is packaged in Debian testing and sid but not trixie, so
  # this runs in its own small container rather than the build job's.
  litmus:
    name: memory-order litmus (herd7)
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.litmus }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - name: herd7 version (ci/Dockerfile, target litmus)
        run: herd7 -version

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Litmus verdicts, witnesses and negative controls
        run: python3 tests/litmus/run_litmus.py
