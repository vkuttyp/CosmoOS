    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      # The release the test starts from never changes: SHA256SUMS checks
      # whatever the cache holds (tools/fetch-release.py).
      - name: Cache the v1.0.3 release set
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/releases
          key: releases-v1.0.3-${{ matrix.arch }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: Install v1.0.3, refuse, interrupt, upgrade, roll back (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make ARCH=${{ matrix.arch }} BUILD=release test-upgrade

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-upgrade-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-release/test-upgrade/*.log
            out/${{ matrix.arch }}-release/test-pkgtx/*.log
            out/${{ matrix.arch }}-release/test-be/*.log
          if-no-files-found: ignore

