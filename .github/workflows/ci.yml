# CosmoOS continuous integration.
#
# Runs the full Phase 0 pipeline on every push and pull request:
#   tool check -> debug build -> QEMU boot test -> release build + test
#   -> host unit tests (ASan/UBSan) -> fuzz targets (x86_64 job)
#   -> static analysis -> reproducibility check -> panic-path test.
#
# The runner is x86-64 Linux. The job runs in a Debian trixie container:
# the virtualization tests need QEMU >= 9.2, whose TCG applies nested
# paging to guests that have their own paging disabled (Ubuntu 24.04
# ships 8.2, which lets such a guest read host memory; the kernel's
# hv self-check then disables the backend and the guest tests are
# skipped, which the harness treats as a failure). The toolchain is
# host-agnostic so the outputs match the ARM64 development environment.
# Every job runs in the project's own toolchain image, built from
# ci/Dockerfile by the `image` job only when that file changes and pulled
# from this repository's GitHub Container Registry by digest (roadmap M6).
# Pulling Debian from a public registry on every job was refused twice by
# rate limits before any code ran: Docker Hub's on main's merge of PR #340
# (run 37991912859, "toomanyrequests"), then ECR Public's ("Data limit
# exceeded", M4).
# Both targets build and boot on the same x86-64 runner: QEMU/TCG runs
# the AArch64 `virt` machine with the qemu-efi-aarch64 firmware.
#
# On a pull request (docs/build/testing.md, "Which jobs a pull request
# runs"): a new push cancels the run of the last one; the `gate` job
# (scripts/ci-gate.py) skips the two long acceptance tests -- the
# large-file test and the encrypted root's `encrypt` part -- unless the
# pull request changes a path they exercise or carries the `full-ci`
# label, and adding that label starts a full run. A push to main, and a
# run by hand, always run everything.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A pull request's newer run cancels its older one. Every other run --
# a push to main, a run by hand, and a pull request's label other than
# full-ci (which the gate turns into no work) -- is a group of its own,
# so nothing cancels it.
concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request'
    && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    && format('pr-{0}', github.event.pull_request.number)
    || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read   # the toolchain image on ghcr.io

jobs:
  # What this run runs (scripts/ci-gate.py): `run` false only for a pull
  # request's label other than full-ci; `heavy` true for the long
  # acceptance tests, which a pull request runs only when it changes a path
  # they exercise or is labelled full-ci.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the pull request's base and head, for the diff

      - name: Decide
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-gate.py

  # The CI images (ci/Dockerfile; scripts/ci-image.sh): pushed to
  # ghcr.io/<owner>/cosmoos-ci under a tag naming the Dockerfile's hash the
  # first time that Dockerfile is seen, found there every later time. Its
  # outputs are digest references, so every job below runs in exactly the
  # image this Dockerfile produced, and a release records that digest.
  image:
    name: CI image
    runs-on: ubuntu-24.04
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      toolchain: ${{ steps.image.outputs.toolchain }}
      litmus: ${{ steps.image.outputs.litmus }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to the GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the images if ci/Dockerfile changed
        id: image
        run: scripts/ci-image.sh "ghcr.io/${{ github.repository_owner }}/cosmoos-ci"

  # The C generated from the kernel's Nova sources matches them
  # (docs/build/design.md, "Nova sources"): recompiled with the pinned novac,
  # the release's Linux x64 archive verified against its SHA-256.
  nova:
    name: Nova sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned novac
        env:
          NOVAC_SHA256: 977472da73d96eea4a43230aa083820da6c85872690960960cf8eaf9882c193c   # novac-linux-x64.tar.gz of the pinned release
        run: |
          v=$(python3 scripts/nova-gen.py --pinned)
          curl -fsSL -o novac.tar.gz "https://github.com/vkuttyp/Nova/releases/download/v$v/novac-linux-x64.tar.gz"
          echo "$NOVAC_SHA256  novac.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/novac" && tar -xzf novac.tar.gz -C "$RUNNER_TEMP/novac" && rm novac.tar.gz
          echo "NOVAC=$RUNNER_TEMP/novac/novac" >> "$GITHUB_ENV"

      - name: Generated C matches its Nova sources
        run: python3 scripts/nova-gen.py --check

  # Roadmap 2.0 SA1 (docs/roadmap-2.0.md, "The Nova rule"): how much of ring
  # 0 and of CosmoOS's own userland is Nova (scripts/nova-share.py), and no
  # change adds C to convert to any tree: a pull request against the commit
  # it branched from, a push to main against the commit before it. On every
  # run, like the Nova sources check.
  nova-share:
    name: nova-share
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: The Nova share, and no new C to convert
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qx '0*'; then
            base=$PUSH_BEFORE
          else
            base=HEAD
          fi
          python3 scripts/nova-share.py --gate "$base"

  build-and-boot:
    name: build, boot, analyze (${{ matrix.arch }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        arch: [x86_64, aarch64]
        # Three parallel parts, each building what its steps need: one
        # job of 50 minutes (aarch64, run 40069427738) set the length of
        # every run. Step times from that run, aarch64 (x86_64):
        #   build  debug build 2.5 (3.1), analyze 5.1 (7.1), release 1.1
        #          (1.2), host tests 1.5 (1.6), fuzz (1.9), reproducible
        #          8.3 (9.8): about 19 (25) minutes
        #   boots  debug build, test 4.8 (5.2), test-gic 3.2 (a no-op),
        #          test-guard 3.2 (3.5), test-smp2 3.0 (3.4): 17 (15)
        #   stress debug build, test-chaos 4.0 (4.5), test-harness-retry
        #          3.9 (4.4), test-crash 3.4 (3.7), test-wxn 3.3 (a
        #          no-op): 17 (16)
        part: [build, boots, stress]
    # 30 was the limit until 2026-09-25: main's aarch64 job had grown to
    # 29-29.5 minutes (runs 36069717395, 36008860068) and was cancelled by
    # it once with every boot passed (run 36028371189).
    # 40 was the limit until 2026-10-11: M3's BusyBox build (musl,
    # compiler-rt, BusyBox, built once more by the reproducible check) took
    # the aarch64 job from 38.9 minutes (run 38098643393) past 40, cancelled
    # in its last boot with every earlier one passed (run 38101481703), and
    # the x86_64 job from 25.8 to 36.9 minutes.
    # 55 was the limit until 2026-10-17: over 52 passing aarch64 jobs of the
    # last 60 runs it took a median of 51.7 minutes, a p95 of 54.0 and at
    # most 54.2, and PR #401's was cancelled at 55.1 in its last step with
    # every boot passed (run 39061354017). A hang guard; each boot keeps its
    # own timeout. 70 was the limit of the one job until 2026-10-24, when it
    # was split in three; the longest part is about 25 minutes.
    timeout-minutes: 45
    env:
      # SIGNING=dev generates an ephemeral signing key here on first use; it
      # lives only in this job's filesystem and is never uploaded (the
      # artifact paths below are all under out/).
      COSMO_KEYDIR: /tmp/cosmo-ci-keys

    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Verify toolchain and that no signing secret is tracked
        if: matrix.part == 'build'
        run: make ARCH=${{ matrix.arch }} check-tools

      - name: Build (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug all

      - name: Static analysis against reviewed architecture baseline
        if: matrix.part == 'build'
        run: make ARCH=${{ matrix.arch }} analyze

      - name: Upload analyzer inventory
        if: always() && matrix.part == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis-inventory-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-debug/analysis-inventory.json
          if-no-files-found: ignore

      - name: Boot test (debug)
        if: matrix.part == 'boots'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test

      # QEMU's virt defaults to gic-version=2, so the step above exercises
      # the GICv2 driver and never the GICv3 one or the ITS. A no-op on
      # x86-64.
      - name: Boot test on the other interrupt controller (debug)
        if: matrix.part == 'boots'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-gic

      # The default CPU models lack SMEP/SMAP/UMIP (qemu64) and PAN
      # (cortex-a72), so the kernel's guard on its access to user memory
      # is a no-op in the boots above. This boots the same image on a
      # model that has the guard and requires the kernel to say so.
      - name: Boot test on a protection-capable CPU (debug)
        if: matrix.part == 'boots'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-guard

      # Every other boot uses four CPUs. Three self-tests needed a third
      # CPU without saying so and failed at two, unseen here
      # (docs/audit/2026-10-05-two-cpu-validation-report.md); this boot
      # keeps the two-CPU premises honest.
      - name: Boot test with two CPUs (debug)
        if: matrix.part == 'boots'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-smp2

      # The same suite with a migrator in the tick moving ready threads
      # between CPUs for no reason (docs/kernel/scheduler/design.md,
      # "Migration"): every concurrency test, with threads moving under it.
      - name: Boot test under a chaos migrator (debug)
        if: matrix.part == 'stress'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-chaos

      # net-harness retries its back-connection because QEMU's user-mode
      # networking resets one connection of it on about one boot in
      # twenty (docs/audit/next-subsystem-nettest-retry.md). Without this
      # step the retry is never exercised here, and a change that broke
      # it would stay green until the flake next struck -- at which point
      # the failure would be indistinguishable from the flake itself.
      # This boot breaks the first attempt on purpose and requires both
      # that it broke and that a later attempt carried the exchange.
      - name: Boot test with the harness's first attempt broken (debug)
        if: matrix.part == 'stress'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-harness-retry

      - name: Build and boot test (release)
        if: matrix.part == 'build'
        run: make ARCH=${{ matrix.arch }} BUILD=release all test

      # The release workflow requires every describe-shaped string in the
      # kernel to be the tag; a message naming another release ("v1.0.7")
      # failed v1.0.8's first tag after main had passed. Checked here, on
      # every change, against the build's own id.
      - name: The release kernel names no other build id
        if: matrix.part == 'build'
        run: python3 scripts/check-release-version.py --kernel out/${{ matrix.arch }}-release/kernel/kernel.elf --build-id "$(git describe --always --dirty)"

      - name: Host unit tests (ASan + UBSan)
        if: matrix.part == 'build'
        run: make ARCH=${{ matrix.arch }} host-test

      # cosmo-fetch, the HTTPS client pkg and cosmo-upgrade run, built for
      # the host on the target's mbedTLS and configuration, against local
      # TLS servers (ports/mbedtls/README.md, "Tested by").
      - name: cosmo-fetch's certificate, redirect and range cases (host, ASan + UBSan)
        if: matrix.part == 'build'
        run: make ARCH=${{ matrix.arch }} host-test-fetch

      # The quiescence epoch core under TSan, with its two negative
      # controls (one pairing weakened each) required to report a race.
      - name: Host TSan model of the quiescence protocol
        if: matrix.part == 'build'
        run: make ARCH=${{ matrix.arch }} host-test-quiesce-tsan

      - name: Fuzz targets (ASan + UBSan, bounded run)
        # Host binaries, identical on either job: run them once.
        if: matrix.arch == 'x86_64' && matrix.part == 'build'
        run: make ARCH=${{ matrix.arch }} fuzz FUZZ_RUNS=50000

      - name: Reproducible build check
        if: matrix.part == 'build'
        run: make ARCH=${{ matrix.arch }} reproducible

      - name: Panic path test
        if: matrix.part == 'stress'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-crash

      # A stack buffer overrun on purpose must panic as one: the stack
      # protector, with per-thread canaries (BUILD-1).
      - name: Stack protector test
        if: matrix.part == 'stress'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-stackprot

      # AArch64: a page mapped writable and executable on purpose must
      # not execute (SCTLR_EL1.WXN). A no-op on x86-64.
      - name: WXN test
        if: matrix.part == 'stress'
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-wxn

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serial-logs-${{ matrix.arch }}-${{ matrix.part }}
          path: out/**/boot-test*.log
          if-no-files-found: ignore

      # A failed boot's serial log names program counters; reading them
      # needs the kernel and module ELFs that boot ran, which the step
      # below uploads only on success. The x86-64 sighting of 2026-10-08
      # (docs/testing/flakes.md, "held for 184 s") could not be
      # symbolised for want of these. Every debug build the boots use:
      # the plain one, the chaos migrator's and the harness-break one.
      - name: Upload debug kernel and modules (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-elfs-${{ matrix.arch }}-${{ matrix.part }}
          path: |
            out/${{ matrix.arch }}-debug*/kernel/kernel.elf
            out/${{ matrix.arch }}-debug*/modules/*.ko
          if-no-files-found: ignore

      - name: Upload binaries
        if: success() && matrix.part == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-debug/kernel/kernel.elf
            out/${{ matrix.arch }}-debug/boot/*.EFI
            out/${{ matrix.arch }}-debug/cosmoos.img
            out/${{ matrix.arch }}-release/kernel/kernel.elf
            out/${{ matrix.arch }}-release/boot/*.EFI

  # Milestone M1's acceptance (docs/roadmap-1.0.md), one source per boot
  # (Makefile, test-entropy): with no source at all (no virtio-rng, a CPU
  # model without RDSEED/RDRAND or RNDR, `random.jitter=off`) the pool
  # must stay unseeded -- getrandom NONBLOCK is EAGAIN, INSECURE answers,
  # an encrypted pool is refused -- and the boot complete; the jitter
  # source alone (AArch64), the CPU alone and the virtio-rng alone must
  # each seed it.
  # The build job's boots are seeded by the firmware. A job of its
  # own: the two boots (about 7 minutes) inside build-and-boot took the
  # aarch64 job past its 40-minute limit (run 37984006846, every boot
  # passed, cancelled in the panic-path step).
  entropy:
    name: entropy boots (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    # Five debug boots. AArch64's job took up to 29.1 min of 30 over the
    # 30 runs to 2026-10-27, and its boots now have 380 s each (Makefile).
    timeout-minutes: 45
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Build (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug all

      - name: Boot tests without an entropy device (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-entropy

      # Load and unload in cycles (docs/kernel/module/design.md, M27):
      # module.cycle= has cosmotest loaded and unloaded 1000 times at boot.
      # Here rather than in build-and-boot, which is near its limit.
      - name: Module load and unload cycles (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-modcycle

  # Milestone M2's acceptance (docs/roadmap-1.0.md; docs/userland/testing.md,
  # "test-install"): the live image installs itself on a blank disk with
  # cosmo-install and the disk is checked on the host. Release builds:
  # every boot here is seconds, not minutes. A job of its own, like the
  # entropy boots, so build-and-boot keeps its time.
  install:
    name: install test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: Install, reboot, persist, fallback (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-install

      # Roadmap 1.2 B1 (docs/roadmap-1.2.md): snapshots of the installed
      # root from the shell. Here rather than in a job of its own: it
      # installs the same release image the step above just installed.
      - name: Snapshots from the shell (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-snapshot

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-install-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-release/test-install/*.log
            out/${{ matrix.arch }}-release/test-snapshot/*.log
          if-no-files-found: ignore


  # Roadmap 1.2 B2's acceptance (docs/roadmap-1.2.md): an installed root
  # damaged in each of the checker's classes and booted, repaired at boot
  # or refused by name and repaired from the live shell; a read-only check
  # that writes nothing; scrub --repair on a two-way mirror. Its own job:
  # some twenty-five boots do not fit beside the install job's.
  fsck:
    name: fsck test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 75
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
