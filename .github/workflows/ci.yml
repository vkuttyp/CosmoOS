# CosmoOS continuous integration.
#
# Runs the full Phase 0 pipeline on every push and pull request:
#   tool check -> debug build -> QEMU boot test -> release build + test
#   -> host unit tests (ASan/UBSan) -> fuzz targets (x86_64 job)
#   -> static analysis -> reproducibility check -> panic-path test.
#
# The runner is x86-64 Linux. The job runs in a Debian trixie container:
# the virtualization tests need QEMU >= 9.2, whose TCG applies nested
# paging to guests that have their own paging disabled (Ubuntu 24.04
# ships 8.2, which lets such a guest read host memory; the kernel's
# hv self-check then disables the backend and the guest tests are
# skipped, which the harness treats as a failure). The toolchain is
# host-agnostic so the outputs match the ARM64 development environment.
# Every job runs in the project's own toolchain image, built from
# ci/Dockerfile by the `image` job only when that file changes and pulled
# from this repository's GitHub Container Registry by digest (roadmap M6).
# Pulling Debian from a public registry on every job was refused twice by
# rate limits before any code ran: Docker Hub's on main's merge of PR #340
# (run 37991912859, "toomanyrequests"), then ECR Public's ("Data limit
# exceeded", M4).
# Both targets build and boot on the same x86-64 runner: QEMU/TCG runs
# the AArch64 `virt` machine with the qemu-efi-aarch64 firmware.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read   # the toolchain image on ghcr.io

jobs:
  # The CI images (ci/Dockerfile; scripts/ci-image.sh): pushed to
  # ghcr.io/<owner>/cosmoos-ci under a tag naming the Dockerfile's hash the
  # first time that Dockerfile is seen, found there every later time. Its
  # outputs are digest references, so every job below runs in exactly the
  # image this Dockerfile produced, and a release records that digest.
  image:
    name: CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      toolchain: ${{ steps.image.outputs.toolchain }}
      litmus: ${{ steps.image.outputs.litmus }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to the GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the images if ci/Dockerfile changed
        id: image
        run: scripts/ci-image.sh "ghcr.io/${{ github.repository_owner }}/cosmoos-ci"

  build-and-boot:
    name: build, boot, analyze (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        arch: [x86_64, aarch64]
    # 30 was the limit until 2026-09-25: main's aarch64 job had grown to
    # 29-29.5 minutes (runs 36069717395, 36008860068) and was cancelled by
    # it once with every boot passed (run 36028371189).
    # 40 was the limit until 2026-10-11: M3's BusyBox build (musl,
    # compiler-rt, BusyBox, built once more by the reproducible check) took
    # the aarch64 job from 38.9 minutes (run 38098643393) past 40, cancelled
    # in its last boot with every earlier one passed (run 38101481703), and
    # the x86_64 job from 25.8 to 36.9 minutes.
    # 55 was the limit until 2026-10-17: over 52 passing aarch64 jobs of the
    # last 60 runs it took a median of 51.7 minutes, a p95 of 54.0 and at
    # most 54.2, and PR #401's was cancelled at 55.1 in its last step with
    # every boot passed (run 39061354017). A hang guard; each boot keeps its
    # own timeout.
    timeout-minutes: 70
    env:
      # SIGNING=dev generates an ephemeral signing key here on first use; it
      # lives only in this job's filesystem and is never uploaded (the
      # artifact paths below are all under out/).
      COSMO_KEYDIR: /tmp/cosmo-ci-keys

    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Verify toolchain and that no signing secret is tracked
        run: make ARCH=${{ matrix.arch }} check-tools

      - name: Build (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug all

      - name: Static analysis against reviewed architecture baseline
        run: make ARCH=${{ matrix.arch }} analyze

      - name: Upload analyzer inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis-inventory-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-debug/analysis-inventory.json
          if-no-files-found: ignore

      - name: Boot test (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test

      # QEMU's virt defaults to gic-version=2, so the step above exercises
      # the GICv2 driver and never the GICv3 one or the ITS. A no-op on
      # x86-64.
      - name: Boot test on the other interrupt controller (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-gic

      # The default CPU models lack SMEP/SMAP/UMIP (qemu64) and PAN
      # (cortex-a72), so the kernel's guard on its access to user memory
      # is a no-op in the boots above. This boots the same image on a
      # model that has the guard and requires the kernel to say so.
      - name: Boot test on a protection-capable CPU (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-guard

      # Every other boot uses four CPUs. Three self-tests needed a third
      # CPU without saying so and failed at two, unseen here
      # (docs/audit/2026-10-05-two-cpu-validation-report.md); this boot
      # keeps the two-CPU premises honest.
      - name: Boot test with two CPUs (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-smp2

      # The same suite with a migrator in the tick moving ready threads
      # between CPUs for no reason (docs/kernel/scheduler/design.md,
      # "Migration"): every concurrency test, with threads moving under it.
      - name: Boot test under a chaos migrator (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-chaos

      # net-harness retries its back-connection because QEMU's user-mode
      # networking resets one connection of it on about one boot in
      # twenty (docs/audit/next-subsystem-nettest-retry.md). Without this
      # step the retry is never exercised here, and a change that broke
      # it would stay green until the flake next struck -- at which point
      # the failure would be indistinguishable from the flake itself.
      # This boot breaks the first attempt on purpose and requires both
      # that it broke and that a later attempt carried the exchange.
      - name: Boot test with the harness's first attempt broken (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-harness-retry

      - name: Build and boot test (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all test

      # The release workflow requires every describe-shaped string in the
      # kernel to be the tag; a message naming another release ("v1.0.7")
      # failed v1.0.8's first tag after main had passed. Checked here, on
      # every change, against the build's own id.
      - name: The release kernel names no other build id
        run: python3 scripts/check-release-version.py --kernel out/${{ matrix.arch }}-release/kernel/kernel.elf --build-id "$(git describe --always --dirty)"

      - name: Host unit tests (ASan + UBSan)
        run: make ARCH=${{ matrix.arch }} host-test

      # cosmo-fetch, the HTTPS client pkg and cosmo-upgrade run, built for
      # the host on the target's mbedTLS and configuration, against local
      # TLS servers (ports/mbedtls/README.md, "Tested by").
      - name: cosmo-fetch's certificate, redirect and range cases (host, ASan + UBSan)
        run: make ARCH=${{ matrix.arch }} host-test-fetch

      # The quiescence epoch core under TSan, with its two negative
      # controls (one pairing weakened each) required to report a race.
      - name: Host TSan model of the quiescence protocol
        run: make ARCH=${{ matrix.arch }} host-test-quiesce-tsan

      - name: Fuzz targets (ASan + UBSan, bounded run)
        # Host binaries, identical on either job: run them once.
        if: matrix.arch == 'x86_64'
        run: make ARCH=${{ matrix.arch }} fuzz FUZZ_RUNS=50000

      - name: Reproducible build check
        run: make ARCH=${{ matrix.arch }} reproducible

      - name: Panic path test
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-crash

      # AArch64: a page mapped writable and executable on purpose must
      # not execute (SCTLR_EL1.WXN). A no-op on x86-64.
      - name: WXN test
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-wxn

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serial-logs-${{ matrix.arch }}
          path: out/**/boot-test*.log
          if-no-files-found: ignore

      # A failed boot's serial log names program counters; reading them
      # needs the kernel and module ELFs that boot ran, which the step
      # below uploads only on success. The x86-64 sighting of 2026-10-08
      # (docs/testing/flakes.md, "held for 184 s") could not be
      # symbolised for want of these. Every debug build the boots use:
      # the plain one, the chaos migrator's and the harness-break one.
      - name: Upload debug kernel and modules (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-elfs-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-debug*/kernel/kernel.elf
            out/${{ matrix.arch }}-debug*/modules/*.ko
          if-no-files-found: ignore

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-debug/kernel/kernel.elf
            out/${{ matrix.arch }}-debug/boot/*.EFI
            out/${{ matrix.arch }}-debug/cosmoos.img
            out/${{ matrix.arch }}-release/kernel/kernel.elf
            out/${{ matrix.arch }}-release/boot/*.EFI

  # Milestone M1's acceptance (docs/roadmap-1.0.md), one source per boot
  # (Makefile, test-entropy): with no source at all (no virtio-rng, a CPU
  # model without RDSEED/RDRAND or RNDR, `random.jitter=off`) the pool
  # must stay unseeded -- getrandom NONBLOCK is EAGAIN, INSECURE answers,
  # an encrypted pool is refused -- and the boot complete; the jitter
  # source alone (AArch64), the CPU alone and the virtio-rng alone must
  # each seed it.
  # The build job's boots are seeded by the firmware. A job of its
  # own: the two boots (about 7 minutes) inside build-and-boot took the
  # aarch64 job past its 40-minute limit (run 37984006846, every boot
  # passed, cancelled in the panic-path step).
  entropy:
    name: entropy boots (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Build (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug all

      - name: Boot tests without an entropy device (debug)
        run: make ARCH=${{ matrix.arch }} BUILD=debug test-entropy

  # Milestone M2's acceptance (docs/roadmap-1.0.md; docs/userland/testing.md,
  # "test-install"): the live image installs itself on a blank disk with
  # cosmo-install and the disk is checked on the host. Release builds:
  # every boot here is seconds, not minutes. A job of its own, like the
  # entropy boots, so build-and-boot keeps its time.
  install:
    name: install test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: Install, reboot, persist, fallback (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-install

      # Roadmap 1.2 B1 (docs/roadmap-1.2.md): snapshots of the installed
      # root from the shell. Here rather than in a job of its own: it
      # installs the same release image the step above just installed.
      - name: Snapshots from the shell (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-snapshot

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-install-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-release/test-install/*.log
            out/${{ matrix.arch }}-release/test-snapshot/*.log
          if-no-files-found: ignore

  # Shell completeness S7's acceptance (docs/roadmap-1.1.md;
  # docs/userland/testing.md, "test-upgrade"): the published v1.0.3,
  # fetched with this run's token and checked against its SHA256SUMS,
  # installs itself, refuses tampered and foreign release sets, survives two
  # interrupted upgrades, is upgraded to this build's release set and
  # rolled back. Release builds, a job of its own like the install test.
  upgrade:
    name: upgrade test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      # The release the test starts from never changes: SHA256SUMS checks
      # whatever the cache holds (tools/fetch-release.py).
      - name: Cache the v1.0.3 release set
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/releases
          key: releases-v1.0.3-${{ matrix.arch }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: Install v1.0.3, refuse, interrupt, upgrade, roll back (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make ARCH=${{ matrix.arch }} BUILD=release test-upgrade

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-upgrade-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-release/test-upgrade/*.log
            out/${{ matrix.arch }}-release/test-pkgtx/*.log
            out/${{ matrix.arch }}-release/test-be/*.log
          if-no-files-found: ignore

  # Milestone M5's acceptance (docs/roadmap-1.0.md; docs/boot/testing.md,
  # "test-security"): the signed image boots and says "verified boot"; one
  # byte changed in the kernel, the archive or the command line, a manifest
  # signed by another key, a forged key id and a missing manifest are each
  # refused by the loader before the kernel runs; the VERIFY_BOOT=0 loader
  # boots the tampered kernel and says UNVERIFIED BOOT. Release builds, a
  # job of its own like the install test.
  security:
    name: security test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: Verified boot, tampered files refused, override (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-security

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-security-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-release/test-security/*.log
          if-no-files-found: ignore

  # Milestone M4's acceptance (docs/roadmap-1.0.md; docs/userland/testing.md,
  # "test-net-login"): the installed system on QEMU user networking with no
  # fw_cfg address -- the kernel's DHCP client configures eth0, netcfg writes
  # /etc/resolv.conf, BusyBox wget fetches by address and by name (the last
  # through the runner's internet, three attempts); job control in ash on the
  # console; the host's OpenSSH client logs in to dropbear by key, runs a
  # command and a PTY session, and logs in again after a reboot with the
  # host key unchanged. Release builds, a job of its own like the install test.
  net-login:
    name: net-login test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: DHCP, wget by address and by name, ssh login and a PTY session on the installed system (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-net-login

      # The virtio-gpu unit's acceptance (docs/drivers/virtio/testing.md):
      # the console on a virtio-gpu, read back from QEMU's screendump; in this
      # job because it needs the same release image and is short (~20 s).
      - name: The console on a virtio-gpu, read back from the screen (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-display

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-net-login-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}-release/test-net-login/*.log
            out/${{ matrix.arch }}-release/test-display/*
          if-no-files-found: ignore

  # Roadmap 1.1 P6's acceptance (docs/pkg/testing.md, "test-pkg-net"): the
  # installed system's pkg against repositories this harness serves over
  # HTTPS -- install and upgrade, and the refusals of untrusted, expired and
  # misnamed certificates (no request reaching the server), a changed
  # package, another key, a replayed and an expired index. Release builds,
  # a job of its own.
  pkg-net:
    name: pkg-net test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: pkg against HTTPS repositories on the installed system (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-pkg-net

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-pkg-net-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-release/test-pkg-net/*.log
          if-no-files-found: ignore

  # Milestone M3's acceptance (docs/roadmap-1.0.md; docs/userland/testing.md,
  # "test-busybox"): BusyBox ash runs the scripted test of every applet and
  # BusyBox's own testsuite for the named files. Release builds, a job of
  # its own like the install test.
  busybox:
    name: busybox test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 30
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: BusyBox ash, the scripted test and the testsuite (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release test-busybox

      - name: Upload the boot's serial log (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-busybox-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-release/test-busybox/*.log
          if-no-files-found: ignore

  # Roadmap M6, decision 8: the release set (`make release`: the signed live
  # image, loader, kernel.elf, boot.tar, cmdline, manifest, SHA256SUMS)
  # built twice in separate trees and compared byte for byte, then made
  # once more and uploaded. Developer-signed here (an ephemeral key in this
  # job); the release workflow builds the same set with the release key in
  # two fresh containers and compares those.
  release-set:
    name: release set, reproducible (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 40
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Release build twice, every output and the release set compared
        run: make ARCH=${{ matrix.arch }} BUILD=release reproducible

      - name: make release
        run: make ARCH=${{ matrix.arch }} release && cat out/release/${{ matrix.arch }}/SHA256SUMS

      - name: Upload the release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-set-${{ matrix.arch }}
          path: out/release/${{ matrix.arch }}/

  # Platform discovery (docs/kernel/arch/aarch64/testing.md, "make
  # test-platforms"): the AArch64 kernel takes its console, GIC, timer and
  # PSCI conduit from the firmware tables, never from QEMU virt's fixed
  # addresses. The image boots under every configuration QEMU can vary --
  # GICv2 and GICv3, highmem off, a CPU with and without RNDR, no serial
  # port -- and must reach the shell with the platform line to match.
  # Both architectures boot with 1, 4 and 8 GiB of RAM: the loader's
  # direct map reaches the top of RAM and `free` reports it.
  platforms:
    name: platform discovery (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45 # eleven AArch64 boots; was 30 for eight
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk') }}

      - name: Build (release)
        run: make ARCH=${{ matrix.arch }} BUILD=release image

      - name: Machines that are not the defaults, and 1, 4 and 8 GiB of RAM
        run: make ARCH=${{ matrix.arch }} BUILD=release test-platforms

      - name: Upload the boots' logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-platforms-${{ matrix.arch }}
          path: out/${{ matrix.arch }}-release/test-platforms/*/*.log
          if-no-files-found: ignore

  # Roadmap M6, decision 4: every subsystem directory docs/README.md lists
  # has architecture, design, api, invariants and testing
  # (scripts/check-docs.py). Python on the runner; no container.
  docs:
    name: five-file docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Every listed subsystem has its five files
        run: python3 scripts/check-docs.py

  # Roadmap M6, decision 5: every command in the user guide (docs/guide/),
  # run as written against the release set by tests/guide/run_guide.py --
  # the host commands in one shell, QEMU and ssh as sessions, each CosmoOS
  # command typed at its prompt with its output checked. Linux, both
  # architectures, on every run.
  guide:
    name: user guide commands (linux, ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: [image, release-set]
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The set the release-set job built, the same bytes guide-macos runs.
      - name: The release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-set-${{ matrix.arch }}
          path: out/release/${{ matrix.arch }}

      - name: Every command of the guide, as written
        run: python3 tests/guide/run_guide.py --arch ${{ matrix.arch }} --host linux --release out/release/${{ matrix.arch }} --workdir out/guide-${{ matrix.arch }}

      - name: Upload the guide run's transcripts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guide-linux-${{ matrix.arch }}
          path: out/guide-${{ matrix.arch }}/*.log
          if-no-files-found: ignore

  # The guide's macOS steps (Homebrew's QEMU and firmware), with the rest of
  # the guide, on GitHub's macOS runner against the release set the
  # release-set job made. On pushes to main (and in the release workflow),
  # not on every pull request: macOS minutes cost ten times Linux's.
  guide-macos:
    name: user guide commands (macos, ${{ matrix.arch }})
    if: github.event_name == 'push'
    runs-on: macos-14
    needs: release-set
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-set-${{ matrix.arch }}
          path: out/release/${{ matrix.arch }}

      - name: Every command of the guide, as written
        run: python3 tests/guide/run_guide.py --arch ${{ matrix.arch }} --host macos --release out/release/${{ matrix.arch }} --workdir out/guide-${{ matrix.arch }}

      - name: Upload the guide run's transcripts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guide-macos-${{ matrix.arch }}
          path: out/guide-${{ matrix.arch }}/*.log
          if-no-files-found: ignore

  # The quiescence protocol's litmus tests against the C11 (RC11) model.
  # herdtools7 is packaged in Debian testing and sid but not trixie, so
  # this runs in its own small container rather than the build job's.
  litmus:
    name: memory-order litmus (herd7)
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.litmus }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - name: herd7 version (ci/Dockerfile, target litmus)
        run: herd7 -version

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Litmus verdicts, witnesses and negative controls
        run: python3 tests/litmus/run_litmus.py
