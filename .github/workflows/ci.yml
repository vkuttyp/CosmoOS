  # Roadmap 1.2 B5's acceptance (docs/roadmap-1.2.md; cosmofs testing.md,
  # "test-encrypt"): an encrypted root installed, its passphrase typed at
  # boot, three wrong ones restarting the machine with nothing mounted, no
  # plaintext on the disk, a second slot, a key-file mirror booting
  # unattended, every metadata domain forged and refused, and a 1 GiB file
  # written and read back; and its last stage, B1-B4's tests again on an
  # encrypted root, split across parallel jobs (make test-encrypt runs it
  # all). Release builds, both architectures.
  encrypt:
    name: encrypted root test (${{ matrix.arch }}, ${{ matrix.part }})
    runs-on: ubuntu-24.04
    needs: [gate, image]
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        # Three parts of about the same length. Local AArch64 at d913b67b
        # (CI ran this job ~1.6x slower in run 40069427738): the stages
        # 1159 s (the 1 GiB written in 754 s, read in 239 s); snapshot 160,
        # pkgtx 174, fsck 312; mirror 258, be 550.
        part: [encrypt, snapshot pkgtx fsck, mirror be]
        include:
          - part: encrypt
            target: test-encrypt ENCRYPT_B1_B4=0
          - part: snapshot pkgtx fsck
            target: test-encrypt-b1b4 ENCRYPT_B1B4_TESTS='snapshot pkgtx fsck'
          - part: mirror be
            target: test-encrypt-b1b4 ENCRYPT_B1B4_TESTS='mirror be'
    # A hang guard: the longest part, the stages, is about 37 minutes on
    # CI with its build (1159 s x 1.6, and 6 for the build).
    timeout-minutes: 75
    env:
      COSMO_KEYDIR: /tmp/cosmo-ci-keys
    steps:
      - name: Toolchain versions (ci/Dockerfile)
        run: |
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs history for BUILD_ID

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # BusyBox, musl and compiler-rt, pinned by SHA-256 in ports/busybox/busybox.mk
      # and fetched once (scripts/fetch-pinned.py): every image carries BusyBox.
      - name: Cache the pinned source archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/ports
          key: ports-${{ hashFiles('ports/busybox/busybox.mk', 'ports/dropbear/dropbear.mk', 'ports/openssh/openssh.mk', 'ports/mbedtls/mbedtls.mk', 'ports/tcc/tcc.mk') }}

      # The encrypt part is a long test (scripts/ci-gate.py): a pull request
      # that the gate finds no reason to run it for skips its two steps.
      - name: Build (release)
        if: matrix.part != 'encrypt' || needs.gate.outputs.heavy == 'true'
        run: make ARCH=${{ matrix.arch }} BUILD=release all

      - name: encrypted root, ${{ matrix.part }} (release)
        if: matrix.part != 'encrypt' || needs.gate.outputs.heavy == 'true'
        run: make ARCH=${{ matrix.arch }} BUILD=release ${{ matrix.target }}

      - name: Upload the boots' serial logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-encrypt-${{ matrix.arch }}-${{ strategy.job-index }}
          # The last stage's B1-B4 runs keep their boots in their own
          # workdirs (test-be's is test-be-encrypted).
          path: |
            out/${{ matrix.arch }}-release/test-encrypt/*.log
            out/${{ matrix.arch }}-release/test-snapshot/*.log
            out/${{ matrix.arch }}-release/test-fsck/*.log
            out/${{ matrix.arch }}-release/test-mirror/*.log
            out/${{ matrix.arch }}-release/test-pkgtx/*.log
            out/${{ matrix.arch }}-release/test-be-encrypted/*.log
          if-no-files-found: ignore

      # Each test-be boot's lines with the second they arrived, kept on a
      # pass too: how long a runner takes over each command is what tells
      # a slow runner from a stuck command (docs/testing/flakes.md,
      # "be-space ... 2026-10-24").
      - name: Upload test-be's boot timings
        if: always() && matrix.part == 'mirror be'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-be-times-${{ matrix.arch }}-${{ github.run_attempt }}
          path: out/${{ matrix.arch }}-release/test-be-encrypted/*-times.log
          if-no-files-found: ignore
  # Shell completeness S7's acceptance (docs/roadmap-1.1.md;
  # docs/userland/testing.md, "test-upgrade"): the published v1.0.3,
  # fetched with this run's token and checked against its SHA256SUMS,
  # installs itself, refuses tampered and foreign release sets, survives two
  # interrupted upgrades, is upgraded to this build's release set and
  # rolled back. Release builds, a job of its own like the install test.
  upgrade:
    name: upgrade test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    # 30 was the limit until 2026-10-31: the aarch64 job (test-upgrade,
    # test-pkgtx and test-be, about 10 minutes of it test-be's boots) took
    # 17-29 minutes over twelve passing runs on 2026-10-30, and the limit
    # cancelled it four times (main's runs 41067037377 and 41103076962,
    # PR #499's 41109526176, PR #502's 41147110864), each on a slow runner
    # with nothing failed: test-upgrade 188 s there against 130 s, and
    # test-be once passed in 1049 s against 617 s just before the limit
    # (docs/testing/flakes.md). x86_64 took 15-23.
